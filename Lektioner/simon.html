<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Says</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #2a2a2a, #111);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 20px;
      transition: filter 0.3s ease;
    }
    .game {
      text-align: center;
      width: 100%;
      max-width: 800px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 10px; font-size: 3rem; text-shadow: 0 0 10px rgba(255,255,255,0.2); transition: all 0.3s ease; }
    .subtitle { opacity: 0.8; margin-bottom: 20px; }
    .info { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 1.1rem; flex-wrap: wrap; }
    .board {
      width: min(78vw, 420px);
      aspect-ratio: 1 / 1;
      height: auto;
      margin: 10px auto;
      position: relative;
      transition: transform 0.2s ease;
    }
    .pad {
      width: 44%;
      height: 44%;
      border-radius: 25px;
      position: absolute;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, left 0.25s ease, top 0.25s ease, background 0.2s ease, opacity 0.3s ease;
      border: 5px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 -10px 20px rgba(0,0,0,0.25), 0 10px 20px rgba(0,0,0,0.3);
    }
    .pad:hover { transform: scale(1.03); }
    .pad.active {
      filter: brightness(2.4);
      transform: scale(1.12);
      box-shadow: 0 0 40px rgba(255,255,255,0.9), 0 0 80px rgba(255,255,255,0.4), inset 0 0 30px rgba(255,255,255,0.45);
      border-color: rgba(255,255,255,0.9);
      z-index: 50;
    }
    .green { background: #00d95f; left: 0%; top: 0%; }
    .red { background: #ff3b30; left: 56%; top: 0%; }
    .yellow { background: #ffd400; left: 0%; top: 56%; }
    .blue { background: #1ea7ff; left: 56%; top: 56%; }
    .message { min-height: 30px; margin-top: 15px; font-size: 1.2rem; font-weight: bold; }
    .flash { animation: flash 0.15s linear; }
    @keyframes flash { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .shake { animation: shake 0.2s linear; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    .evil { color: #ff5b5b; text-shadow: 0 0 8px red; }
    #clickOverlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #clickOverlay .click-hint {
      font-size: 1.4rem;
      font-weight: bold;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.05em;
      animation: pulse 1.8s ease-in-out infinite;
      pointer-events: none;
      text-align: center;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    #clickOverlay.hidden { display: none; }
    .warning {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2rem;
      color: #ff8a8a;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 9999;
      text-align: center;
      width: 90%;
    }
    .warning.show { opacity: 1; }
    #fakeScore {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.85rem;
      opacity: 0.4;
      color: #aaa;
      pointer-events: none;
    }
    #countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      font-size: 5rem;
      font-weight: bold;
      color: white;
      pointer-events: none;
      opacity: 0;
      z-index: 9999;
      text-shadow: 0 0 30px red;
      transition: opacity 0.2s ease;
    }
    #snarkyComment {
      font-size: 0.9rem;
      color: #888;
      margin-top: 6px;
      min-height: 20px;
      font-style: italic;
    }

    @media (max-width: 650px) {
      body { padding: 10px; }
      .game { padding: 10px; }
      .board { width: min(88vw, 320px); }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="warning" id="warning">THE BUTTONS ARE LYING.</div>
  <div id="countdown"></div>
  <div id="fakeScore">High Score: 47</div>

  <div class="game">
    <h1 id="title">Simon Says</h1>
    <div class="subtitle">Repeat the sequence. We believe in you. (We don't.)</div>

    <div class="info">
      <div>Level: <span id="level">1</span></div>
      <div>Sequence: <span id="length">0</span></div>
    </div>

    <div class="board" id="board">
      <div class="pad green" data-color="green"></div>
      <div class="pad red" data-color="red"></div>
      <div class="pad yellow" data-color="yellow"></div>
      <div class="pad blue" data-color="blue"></div>
    </div>

    <div class="message" id="message"></div>
    <div id="snarkyComment"></div>
  </div>

  <div id="clickOverlay">
    <div class="click-hint">Click anywhere to start</div>
  </div>

  <script>
    const colors = ['green', 'red', 'yellow', 'blue'];
    const pads = [...document.querySelectorAll('.pad')];
    const levelEl = document.getElementById('level');
    const lengthEl = document.getElementById('length');
    const messageEl = document.getElementById('message');
    const board = document.getElementById('board');
    const warning = document.getElementById('warning');
    const titleEl = document.getElementById('title');
    const snarkyEl = document.getElementById('snarkyComment');
    const countdown = document.getElementById('countdown');
    const overlay = document.getElementById('clickOverlay');

    let sequence = [];
    let playerIndex = 0;
    let level = 1;
    let acceptingInput = false;
    let started = false;
    let totalClicks = 0;
    let wrongClicks = 0;

    const snarkyFails = [
      "lol",
      "bro.",
      "it was literally right there",
      "my grandma plays better than this",
      "did you even watch?",
      "skill issue",
      "you had ONE job",
      "are you okay?",
      "classic",
      "maybe try solitaire",
      "not a great look",
      "i'm embarrassed for you",
    ];

    const padPositions = {
      green: { left: '0%', top: '0%' },
      red: { left: '56%', top: '0%' },
      yellow: { left: '0%', top: '56%' },
      blue: { left: '56%', top: '56%' },
    };

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function randomColor() { return colors[Math.floor(Math.random() * colors.length)]; }
    function getPad(color) { return document.querySelector(`[data-color="${color}"]`); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    async function flash(color) {
      const pad = getPad(color);
      pad.classList.add('active');
      if (navigator.vibrate) navigator.vibrate(40);
      await sleep(520);
      pad.classList.remove('active');
      await sleep(180);
    }

    async function playSequence() {
      acceptingInput = false;
      messageEl.textContent = 'Watch carefully...';
      snarkyEl.textContent = '';

      for (const color of sequence) {
        await flash(color);
      }

      messageEl.textContent = 'Your turn.';
      acceptingInput = true;
      if (level >= 3) startMicroDodges();
    }

    function addStep() {
      sequence.push(randomColor());
      lengthEl.textContent = sequence.length;
    }

    async function nextLevel() {
      playerIndex = 0;
      levelEl.textContent = level;
      addStep();
      applyChaos();

      if (level >= 7) {
        await fakeCountdown();
      }

      await sleep(600);
      await playSequence();
    }

    function resetGame() {
      sequence = [];
      playerIndex = 0;
      level = 1;
      acceptingInput = false;
      totalClicks = 0;
      wrongClicks = 0;
      stopChaos();
      resetBoard();
      resetVisuals();
      levelEl.textContent = '1';
      lengthEl.textContent = '0';
      snarkyEl.textContent = '';
      document.body.style.filter = '';
      titleEl.textContent = 'Simon Says';
      titleEl.style.transform = '';
      titleEl.style.fontSize = '';
    }

    function lose() {
      acceptingInput = false;
      started = false;
      board.classList.add('shake');
      setTimeout(() => board.classList.remove('shake'), 300);
      const snark = pick(snarkyFails);
      messageEl.innerHTML = '<span class="evil">Wrong sequence.</span>';
      snarkyEl.textContent = snark;
      document.body.style.filter = 'hue-rotate(180deg)';
      setTimeout(() => { document.body.style.filter = ''; }, 800);
      stopChaos();
      setTimeout(() => { overlay.classList.remove('hidden'); }, 1200);
    }

    async function handleClick(color) {
      if (!acceptingInput) return;
      totalClicks++;
      const expected = sequence[playerIndex];
      await flash(color);

      if (color !== expected) {
        wrongClicks++;
        lose();
        return;
      }

      playerIndex++;
      if (playerIndex >= sequence.length) {
        acceptingInput = false;
        const compliments = ['Level complete.', 'Not bad... for now.', 'Lucky.', 'Hmm. Okay.', 'You got that one.'];
        messageEl.textContent = level < 4 ? 'Level complete.' : pick(compliments);
        level++;
        setTimeout(nextLevel, 1200);
      }
    }

    pads.forEach(pad => {
      pad.addEventListener('click', () => handleClick(pad.dataset.color));
    });

    overlay.addEventListener('click', async () => {
      if (started) return;
      started = true;
      overlay.classList.add('hidden');
      resetGame();
      messageEl.textContent = 'Memorize.';
      await sleep(500);
      nextLevel();
    });

    let chaosIntervals = [];
    let dodgeTimeout;

    function stopChaos() {
      chaosIntervals.forEach(clearInterval);
      chaosIntervals = [];
      clearTimeout(dodgeTimeout);
    }

    function resetBoard() {
      padPositions.green = { left: '0%', top: '0%' };
      padPositions.red = { left: '56%', top: '0%' };
      padPositions.yellow = { left: '0%', top: '56%' };
      padPositions.blue = { left: '56%', top: '56%' };
      pads.forEach(pad => {
        const pos = padPositions[pad.dataset.color];
        pad.style.left = pos.left;
        pad.style.top = pos.top;
        pad.style.transform = 'translate(0px, 0px)';
        pad.style.opacity = '1';
      });
    }

    function resetVisuals() {
      document.querySelector('.green').style.background = '#00d95f';
      document.querySelector('.red').style.background = '#ff3b30';
      document.querySelector('.yellow').style.background = '#ffd400';
      document.querySelector('.blue').style.background = '#1ea7ff';
      board.style.transform = '';
      document.body.style.cursor = '';
    }

    function swapPadPositions(a, b) {
      const padA = getPad(a);
      const padB = getPad(b);
      const temp = { ...padPositions[a] };
      padPositions[a] = { ...padPositions[b] };
      padPositions[b] = temp;
      padA.style.left = padPositions[a].left;
      padA.style.top = padPositions[a].top;
      padB.style.left = padPositions[b].left;
      padB.style.top = padPositions[b].top;
    }

    function shuffleColorsVisually() {
      const visuals = { green: '#00d95f', red: '#ff3b30', yellow: '#ffd400', blue: '#1ea7ff' };
      const shuffled = [...colors].sort(() => Math.random() - 0.5);
      pads.forEach((pad, i) => { pad.style.background = visuals[shuffled[i]]; });
      setTimeout(() => {
        document.querySelector('.green').style.background = '#2ecc71';
        document.querySelector('.red').style.background = '#e74c3c';
        document.querySelector('.yellow').style.background = '#f1c40f';
        document.querySelector('.blue').style.background = '#3498db';
      }, 900);
    }

    function showWarning(text) {
      warning.textContent = text;
      warning.classList.add('show');
      setTimeout(() => warning.classList.remove('show'), 1400);
    }

    async function fakeCountdown() {
      countdown.style.opacity = '1';
      for (let i = 3; i >= 1; i--) {
        countdown.textContent = i;
        await sleep(700);
      }
      countdown.textContent = '...just kidding';
      await sleep(900);
      countdown.style.opacity = '0';
      countdown.textContent = '';
    }

    function applyChaos() {
      stopChaos();
      resetBoard();
      resetVisuals();

      if (level >= 4) {
        const swapInterval = setInterval(() => {
          if (!acceptingInput) return;
          const a = randomColor();
          let b = randomColor();
          while (a === b) b = randomColor();
          swapPadPositions(a, b);
          showWarning('BUTTONS MOVED');
        }, Math.max(2400 - level * 120, 900));
        chaosIntervals.push(swapInterval);
      }


      if (level >= 6) {
        const colorChaos = setInterval(() => {
          if (!acceptingInput) return;
          shuffleColorsVisually();
          showWarning('THE COLORS ARE FAKE');
        }, Math.max(4500 - level * 180, 1800));
        chaosIntervals.push(colorChaos);
      }

      if (level >= 7) {
        const titleChaos = setInterval(() => {
          if (!acceptingInput) return;
          const lies = ['Simon Lies','Troll Says','Pay Attention','Wrong','Are You Sure?','😈 Says','Good Luck Lol','Yes This One','Wait No','Simon Doubts'];
          titleEl.textContent = pick(lies);
          setTimeout(() => { titleEl.textContent = 'Simon Says'; }, 1000);
        }, 3500);
        chaosIntervals.push(titleChaos);
      }

      if (level >= 8) {
        document.body.style.cursor = 'crosshair';
        const blinkChaos = setInterval(() => {
          if (!acceptingInput) return;
          const pad = getPad(randomColor());
          pad.style.opacity = '0';
          setTimeout(() => { pad.style.opacity = '1'; }, 400);
          showWarning('WHERE DID IT GO?');
        }, 2800);
        chaosIntervals.push(blinkChaos);
      }

      if (level >= 9) {
        const spinChaos = setInterval(() => {
          if (!acceptingInput) return;
          board.style.transform = `rotate(${Math.random() * 180 - 90}deg)`;
          setTimeout(() => { board.style.transform = 'rotate(0deg)'; }, 400);
        }, 2200);
        chaosIntervals.push(spinChaos);
      }

      if (level >= 10) {
        const hueShift = setInterval(() => {
          if (!acceptingInput) return;
          document.body.style.filter = `hue-rotate(${Math.floor(Math.random()*360)}deg)`;
          showWarning('IS THIS REAL?');
          setTimeout(() => { document.body.style.filter = ''; }, 600);
        }, 2500);
        chaosIntervals.push(hueShift);
      }

      if (level >= 12) {
        const fakeLose = setInterval(() => {
          if (!acceptingInput) return;
          const orig = messageEl.innerHTML;
          messageEl.innerHTML = '<span class="evil">Wrong sequence. jk.</span>';
          board.classList.add('shake');
          setTimeout(() => {
            board.classList.remove('shake');
            if (acceptingInput) messageEl.innerHTML = orig;
          }, 400);
        }, 5000);
        chaosIntervals.push(fakeLose);
      }
    }

    function startMicroDodges() {
      pads.forEach(pad => {
        pad.onmouseenter = null;
        if (level < 5) return;
        pad.onmouseenter = () => {
          if (!acceptingInput) return;
          if (Math.random() > 0.45) return;
          const moveX = Math.random() * 40 - 20;
          const moveY = Math.random() * 40 - 20;
          pad.style.transform = `translate(${moveX}px, ${moveY}px)`;
          setTimeout(() => { pad.style.transform = 'translate(0px, 0px)'; }, 180);
        };
      });
    }

    resetBoard();
  </script>
</body>
</html>
